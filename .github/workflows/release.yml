name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Create Release PR
        id: changesets
        uses: changesets/action@v1
        with:
          commit: 'Update changelog for release'
          title: 'Update changelog for release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Tag and GitHub Release
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version package.json)
          TAG="v$VERSION"

          # Only release if the tag doesn't already exist on the remote
          if ! git ls-remote --tags origin | grep -q "refs/tags/$TAG"; then
            echo "Creating tag $TAG..."
            git tag "$TAG"
            git push origin "$TAG"

            echo "Extracting release notes..."
            # Extract the changelog section specifically for this version
            awk "/^## $VERSION/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md > release-notes.md

            echo "Creating GitHub Release $TAG..."
            gh release create "$TAG" -F release-notes.md -t "$TAG"
          else
            echo "Tag $TAG already exists, skipping release."
          fi
